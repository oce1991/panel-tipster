name: Actualizar datos de ligas

on:
  schedule:
    # Se ejecuta a las 06:00 UTC todos los dias (unas 2 horas antes de la manana en España).
    - cron: '0 6 * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestana "Actions" de GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar y actualizar datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WEIGHT: '3'
        run: node actualizar-datos.js
